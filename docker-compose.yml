services:
  hai-tpcg-cam-script:
    build: .
    container_name: hai-tpcg-cam-script
    restart: unless-stopped

    ports:
      - "8088:8080"
      - "2222:22"
      - "9900:990"
      - "30000-30010:30000-30010"

    environment:
      TZ: ${TZ:-Europe/Berlin}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_PASS_HASH: ${ADMIN_PASS_HASH:-}
      API_KEY: ${API_KEY}
      SFTP_USER: ${SFTP_USER:-tpcgtransfer}
      SFTP_PASSWORD: ${SFTP_PASSWORD}
      FTPS_USER: ${FTPS_USER:-tpcgtransfer}
      FTPS_PASSWORD: ${FTPS_PASSWORD}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://cam.example.de}
      PROCESS_INTERVAL_SECONDS: ${PROCESS_INTERVAL_SECONDS:-30}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llava}

    volumes:
      - ${DATA_ROOT:-/opt/hai-tpcg-cam-script/data}/input:/data/input
      - ${DATA_ROOT:-/opt/hai-tpcg-cam-script/data}/output:/data/output
      - ${DATA_ROOT:-/opt/hai-tpcg-cam-script/data}/scripts:/data/scripts
      - ${DATA_ROOT:-/opt/hai-tpcg-cam-script/data}/backups:/data/backups
      - ${DATA_ROOT:-/opt/hai-tpcg-cam-script/data}/logs:/data/logs
      - ${DATA_ROOT:-/opt/hai-tpcg-cam-script/data}/config:/data/config
