services:
  hai-tpcgcamscript:
    image: ghcr.io/jbkunama1/hai.tpcgcamscript:latest
    container_name: hai-tpcg-cam-script
    restart: unless-stopped

    ports:
      - "8067:8080"
      - "21:21"
      - "2222:22"
      - "9900:990"
      - "30000-30010:30000-30010"

    environment:
      TZ: ${TZ:-Europe/Berlin}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_PASS_HASH: ${ADMIN_PASS_HASH:-}
      API_KEY: ${API_KEY}
      SFTP_USER: ${SFTP_USER:-tpcgtransfer}
      SFTP_PASSWORD: ${SFTP_PASSWORD}
      FTPS_USER: ${FTPS_USER:-tpcgtransfer}
      FTPS_PASSWORD: ${FTPS_PASSWORD}
      # WICHTIG: DATA_ROOT ist der Container-Pfad des Workers (nicht der Host-Pfad!).
      # Der Host-Pfad /opt/hai-tpcg-cam-script/data wird per Volume nach /data gemountet.
      DATA_ROOT: /data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://cam.example.de}
      PROCESS_INTERVAL_SECONDS: ${PROCESS_INTERVAL_SECONDS:-30}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llava}

    volumes:
      - /opt/hai-tpcg-cam-script/data/input:/data/input
      - /opt/hai-tpcg-cam-script/data/output:/data/output
      - /opt/hai-tpcg-cam-script/data/scripts:/data/scripts
      - /opt/hai-tpcg-cam-script/data/backups:/data/backups
      - /opt/hai-tpcg-cam-script/data/logs:/data/logs
      - /opt/hai-tpcg-cam-script/data/config:/data/config

    networks:
      - highfishNetwork

networks:
  highfishNetwork:
    external: true
    name: highfishNetwork
