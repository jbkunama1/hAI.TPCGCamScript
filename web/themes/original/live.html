<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>TPCG Live-Webcams – Tennis & Padel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/assets/webcam.css" />
  <script src="/assets/jquery.js"></script>
  <script src="/assets/webcam.js"></script>
</head>
<body>

<div class="container">
  <div class="header-container">
    <div class="tpcg">
      <img src="/assets/TPCG-Logo_Original.jpg"
           alt="TPCG Logo"
           class="logo-tpcg" />
    </div>
    <div class="ueberschrift-container">
      <h1>TPCG Live-Webcams</h1>
      <h2>Tennis &amp; Padel – aktuelle Platzansicht</h2>
    </div>
    <div class="lets-netz">
      <img src="/assets/letsnetz.jpg"
           alt="Let's Netz"
           class="logo-letsnetz" />
    </div>
  </div>

  <div class="webcam header-container">
    <div class="webcamtennis">
      <h3>Tennis-Center Court</h3>
      <div class="webcambildplatzhalter">
        <img src="/assets/platzhalter.jpg" alt="Platzhalter Tennis" />
      </div>
      <div class="webcambildreal">
        <img src="/output/tennis/webcam_live.jpg" alt="Tennis Webcam live" />
      </div>
    </div>

    <div class="webcampadel1">
      <h3>Padel – Platz 1</h3>
      <div class="webcambildplatzhalter">
        <img src="/assets/platzhalter.jpg" alt="Platzhalter Padel 1" />
      </div>
      <div class="webcambildreal">
        <img src="/output/padel/webcam1_live.jpg" alt="Padel Webcam 1 live" />
      </div>
    </div>

    <div class="webcampadel2">
      <h3>Padel – Platz 2</h3>
      <div class="webcambildplatzhalter">
        <img src="/assets/platzhalter.jpg" alt="Platzhalter Padel 2" />
      </div>
      <div class="webcambildreal">
        <img src="/output/padel/webcam2_live.jpg" alt="Padel Webcam 2 live" />
      </div>
    </div>
  </div>

  <div class="container-text">
    <div class="aktualisieren">
      <a href="javascript:window.location.reload();">Ansicht aktualisieren</a>
    </div>
  </div>
</div>

</body>
</html>
