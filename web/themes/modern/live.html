<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>TPCG Live – Modern Theme</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1120;
      color: #e5e7eb;
    }
    header {
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, #111827, #1f2937);
      border-bottom: 1px solid #1f2937;
    }
    header h1 {
      font-size: 1.4rem;
      margin: 0;
    }
    header h2 {
      font-size: 0.9rem;
      margin: 0;
      color: #9ca3af;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      padding: 1.5rem 2rem 2rem;
    }
    .card {
      background: #111827;
      border-radius: 0.75rem;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.75);
      overflow: hidden;
    }
    .card header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1f2937;
      background: #0f172a;
    }
    .card header h3 {
      margin: 0;
      font-size: 0.95rem;
    }
    .card img {
      display: block;
      width: 100%;
      height: auto;
    }
    .footer {
      padding: 0.75rem 2rem 1.5rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      border: 1px solid #2563eb;
      background: #1d4ed8;
      color: #e5e7eb;
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #2563eb;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>TPCG Live-Webcams</h1>
    <h2>Tennis &amp; Padel – Modern Preview</h2>
  </div>
</header>

<main class="grid">
  <section class="card">
    <header>
      <h3>Tennis-Center Court</h3>
    </header>
    <img src="/output/tennis/webcam_live.jpg" alt="Tennis Webcam live" />
  </section>

  <section class="card">
    <header>
      <h3>Padel – Platz 1</h3>
    </header>
    <img src="/output/padel/webcam1_live.jpg" alt="Padel Webcam 1 live" />
  </section>

  <section class="card">
    <header>
      <h3>Padel – Platz 2</h3>
    </header>
    <img src="/output/padel/webcam2_live.jpg" alt="Padel Webcam 2 live" />
  </section>
</main>

<div class="footer">
  <span>Alle 30 Sekunden aktualisiert</span>
  <button class="btn" onclick="window.location.reload();">
    Ansicht aktualisieren
  </button>
</div>

</body>
</html>
