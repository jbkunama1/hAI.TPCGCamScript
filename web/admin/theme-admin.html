<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>TPCG Live – Theme-Auswahl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      color: #111827;
    }
    .shell {
      max-width: 640px;
      margin: 2rem auto;
      padding: 1.5rem 1.75rem;
      background: #ffffff;
      border-radius: 0.75rem;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
    }
    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }
    .theme-option {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .theme-option:last-child {
      border-bottom: none;
    }
    .theme-option label {
      font-weight: 600;
    }
    .theme-option p {
      margin: 0.15rem 0 0;
      font-size: 0.9rem;
      color: #6b7280;
    }
    button {
      margin-top: 1.25rem;
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      border: none;
      background: #1d4ed8;
      color: #ffffff;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
    }
    .hint {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #6b7280;
    }
  </style>
</head>
<body>

<div class="shell">
  <h1>Live-Webcam Theme-Auswahl</h1>
  <form id="theme-form">
    <div class="theme-option">
      <input type="radio" name="theme" id="theme-original" value="original" checked />
      <div>
        <label for="theme-original">Original (TPCG / Let’s Netz)</label>
        <p>Klassisches Layout mit TPCG-Logo, Let’s Netz und Platzhalterbildern.</p>
      </div>
    </div>

    <div class="theme-option">
      <input type="radio" name="theme" id="theme-modern" value="modern" />
      <div>
        <label for="theme-modern">Modern (dunkles UI)</label>
        <p>Schlichte, dunkle Live-Ansicht mit Kartenlayout.</p>
      </div>
    </div>

    <button type="submit">Theme speichern</button>
    <div class="hint" id="theme-status"></div>
  </form>
</div>

<script>
document.getElementById("theme-form").addEventListener("submit", async function (ev) {
  ev.preventDefault();
  const formData = new FormData(ev.target);
  const theme = formData.get("theme");
  try {
    const resp = await fetch("/api/theme", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ theme })
    });
    if (!resp.ok) {
      throw new Error("HTTP " + resp.status);
    }
    const data = await resp.json();
    document.getElementById("theme-status").textContent =
      "Theme gespeichert: " + (data.theme || theme);
  } catch (e) {
    document.getElementById("theme-status").textContent =
      "Fehler beim Speichern: " + e;
  }
});
</script>

</body>
</html>
