listen=YES
listen_ipv6=NO
listen_port=990
implicit_ssl=YES
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
pasv_enable=YES
pasv_min_port=30006
pasv_max_port=30010
# pasv_address wird zur Laufzeit aus $PASV_ADDRESS gesetzt (supervisord.conf)
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
rsa_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
rsa_private_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
ssl_enable=YES
allow_anon_ssl=NO
force_local_data_ssl=YES
force_local_logins_ssl=YES
require_ssl_reuse=NO
# Logging for FTPS (visible in Admin -> Logs, shared with port 21 instance)
xferlog_enable=YES
log_ftp_protocol=YES
xferlog_std_format=NO
dual_log=YES
vsftpd_log_file=/data/logs/vsftpd.log
xferlog_file=/data/logs/xferlog
