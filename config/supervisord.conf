[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:gunicorn]
command=/venv/bin/gunicorn -w 3 -b 0.0.0.0:8080 --access-logfile /data/logs/gunicorn-access.log --error-logfile - app.main:app
directory=/app
autostart=true
autorestart=true

[program:camera_worker]
command=/venv/bin/python /app/app/camera_worker.py
directory=/app
autostart=true
autorestart=true

[program:vsftpd]
command=/usr/sbin/vsftpd /etc/vsftpd.conf
autostart=true
autorestart=true

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
