[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:gunicorn]
command=/venv/bin/gunicorn -w 3 -b 0.0.0.0:8080 --access-logfile /data/logs/gunicorn-access.log --error-logfile - app.main:app
directory=/app
autostart=true
autorestart=true

[program:camera_worker]
command=/venv/bin/python /app/app/camera_worker.py
directory=/app
autostart=true
autorestart=true

[program:vsftpd]
command=/bin/sh -c 'sed -i "/^pasv_address/d" /etc/vsftpd.conf; if [ -n "$PASV_ADDRESS" ]; then echo "pasv_address=$PASV_ADDRESS" >> /etc/vsftpd.conf; fi; exec /usr/sbin/vsftpd /etc/vsftpd.conf'
autostart=true
autorestart=true
stdout_logfile=/data/logs/vsftpd-supervisor.log
stderr_logfile=/data/logs/vsftpd-supervisor.log

[program:vsftpd-990]
command=/bin/sh -c 'sed -i "/^pasv_address/d" /etc/vsftpd-990.conf; if [ -n "$PASV_ADDRESS" ]; then echo "pasv_address=$PASV_ADDRESS" >> /etc/vsftpd-990.conf; fi; exec /usr/sbin/vsftpd /etc/vsftpd-990.conf'
autostart=true
autorestart=true
stdout_logfile=/data/logs/vsftpd-990-supervisor.log
stderr_logfile=/data/logs/vsftpd-990-supervisor.log

[program:sshd]
command=/usr/sbin/sshd -D -E /data/logs/sshd.log
autostart=true
autorestart=true
stdout_logfile=/data/logs/sshd-supervisor.log
stderr_logfile=/data/logs/sshd-supervisor.log
