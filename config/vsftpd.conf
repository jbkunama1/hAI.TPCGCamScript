listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
# Kamera-Uploads landen im Worker-Eingang (Unterordner tennis/ und padel/)
local_root=/data/input

ssl_enable=YES
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_cert_file=/etc/vsftpd/ssl/server.crt
ssl_key_file=/etc/vsftpd/ssl/server.key
require_ssl_reuse=NO
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO

pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30010
pasv_address=0.0.0.0

userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# Logging ins gemountete Daten-Volume (sichtbar auf dem Host und via /api/logs)
log_ftp_protocol=YES
xferlog_enable=YES
xferlog_file=/data/logs/vsftpd-xfer.log
vsftpd_log_file=/data/logs/vsftpd.log
