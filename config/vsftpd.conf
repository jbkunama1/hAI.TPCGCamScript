listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
# Kamera-Uploads landen im Worker-Eingang (Unterordner tennis/ und padel/)
local_root=/data/input

# PAM-Service aus dem vsftpd-Paket (ohne diese Zeile schlaegt der Login mit 530 fehl)
pam_service_name=vsftpd

ssl_enable=YES
force_local_data_ssl=YES
force_local_logins_ssl=YES
# WICHTIG: Die vsftpd-Optionsnamen lauten rsa_cert_file/rsa_private_key_file.
# ssl_cert_file/ssl_key_file existieren nicht und lassen vsftpd lautlos sterben.
rsa_cert_file=/etc/vsftpd/ssl/server.crt
rsa_private_key_file=/etc/vsftpd/ssl/server.key
require_ssl_reuse=NO

pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30010
# Wird beim Containerstart per PASV_ADDRESS-Env ersetzt (oeffentlicher Hostname/IP)
pasv_address=0.0.0.0
# Erlaubt einen Hostnamen statt IP in pasv_address
pasv_addr_resolve=YES

userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# Logging ins gemountete Daten-Volume (sichtbar auf dem Host und via /api/logs)
log_ftp_protocol=YES
xferlog_enable=YES
xferlog_file=/data/logs/vsftpd-xfer.log
vsftpd_log_file=/data/logs/vsftpd.log
